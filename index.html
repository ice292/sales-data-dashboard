<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>รายงานข้อมูลการขาย</title>
<meta name="description" content="รายงานวิเคราะห์ข้อมูลการขาย 10,000 คำสั่งซื้อ ปี 2024–2025 หลังคัดข้อมูลขยะออก" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f4f1; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --track: #eeede8; --ring: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19; --page: #0d0d0d; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --track: #262624; --ring: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19; --page: #0d0d0d; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --track: #262624; --ring: rgba(255,255,255,0.10);
  }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font-family: 'Sarabun', system-ui, sans-serif; overflow-x: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  #loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Prompt', sans-serif; color: var(--muted); }
  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div id="root"><div id="loading">กำลังโหลดรายงาน…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@mui/material@5.15.15/umd/material-ui.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="data/summary.js"></script>
<script src="data/junk.js"></script>

<script type="text/babel" data-presets="react">
const {
  ThemeProvider, createTheme, CssBaseline, AppBar, Toolbar, Typography, Container, Grid, Card, CardContent,
  Box, Chip, ToggleButton, ToggleButtonGroup, Tooltip, Table, TableHead, TableBody, TableRow, TableCell,
  TableContainer, Button, Alert, Stack, Divider, Icon, useMediaQuery, Switch, FormControlLabel, Link,
  Tabs, Tab, TablePagination, TextField, InputAdornment, Paper,
} = MaterialUI;
const J = window.JUNK_DATA;
const { useState, useMemo, useRef, useEffect } = React;

const D = window.SALES_DATA;
const Q = D.quality;

/* ---------- palette (validated reference palette, light/dark steps) ---------- */
const PAL = {
  light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'],
  dark:  ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c', '#9085e9', '#e66767'],
};
const INK_ON = (hex) => (hex === '#eda100' || hex === '#c98500') ? '#0b0b0b' : '#ffffff';
// colour follows the entity, never its rank
const ENTITY_SLOT = {
  'แอปมือถือ': 0, 'เว็บไซต์': 1, 'หน้าร้าน': 2, 'โซเชียลมีเดีย': 3,
  'พร้อมเพย์': 0, 'บัตรเครดิต': 1, 'เก็บเงินปลายทาง': 2, 'โอนผ่านธนาคาร': 3, 'เงินสด': 4,
  'สำเร็จ': 0, 'ยกเลิก': 1, 'คืนสินค้า': 2,
  'หญิง': 0, 'ชาย': 1, 'ไม่ระบุ': 2,
  'จ่ายเงินขัดแย้ง': 0, 'เพศไม่ระบุ': 1, 'อายุ 15 (ปัด)': 2, 'รีวิวว่าง': 3,
};

/* ---------- formatting ---------- */
const nf = new Intl.NumberFormat('th-TH');
const nf2 = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 });
const fmtN = (v) => nf.format(Math.round(v));
const fmtB = (v) => '฿' + nf.format(Math.round(v));
const fmtCompactB = (v) => v >= 1e6 ? '฿' + nf2.format(v / 1e6) + ' ล้าน' : v >= 1e3 ? '฿' + nf2.format(v / 1e3) + 'K' : '฿' + fmtN(v);
const pct = (a, b) => (b ? (a / b) * 100 : 0);
const fmtPct = (v, d = 1) => v.toFixed(d) + '%';
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const niceMax = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };

/* ---------- building blocks ---------- */
function Section({ id, icon, title, subtitle, children }) {
  return (
    <Box component="section" id={id} sx={{ mt: 5, scrollMarginTop: 80 }}>
      <Stack direction="row" spacing={1.25} alignItems="center" sx={{ mb: 0.5 }}>
        <Icon sx={{ color: 'primary.main' }}>{icon}</Icon>
        <Typography variant="h5" component="h2">{title}</Typography>
      </Stack>
      {subtitle && <Typography sx={{ color: 'text.secondary', mb: 2 }}>{subtitle}</Typography>}
      {children}
    </Box>
  );
}

function ChartCard({ title, note, table, children, minH }) {
  const [showTable, setShowTable] = useState(false);
  return (
    <Card variant="outlined" sx={{ height: '100%', borderRadius: 3 }}>
      <CardContent sx={{ p: { xs: 2, sm: 2.5 } }}>
        <Stack direction="row" alignItems="flex-start" justifyContent="space-between" spacing={1} sx={{ mb: 1.5 }}>
          <Box>
            <Typography variant="subtitle1" component="h3" sx={{ fontWeight: 600, lineHeight: 1.35 }}>{title}</Typography>
            {note && <Typography variant="body2" sx={{ color: 'text.secondary', mt: 0.25 }}>{note}</Typography>}
          </Box>
          {table && (
            <Tooltip title={showTable ? 'แสดงกราฟ' : 'แสดงเป็นตาราง'}>
              <Button size="small" className="no-print" onClick={() => setShowTable(!showTable)}
                startIcon={<Icon fontSize="small">{showTable ? 'bar_chart' : 'table_rows'}</Icon>}
                sx={{ flexShrink: 0, color: 'text.secondary' }}>
                {showTable ? 'กราฟ' : 'ตาราง'}
              </Button>
            </Tooltip>
          )}
        </Stack>
        <Box sx={{ minHeight: minH }}>
          {showTable && table ? <DataTable {...table} /> : children}
        </Box>
      </CardContent>
    </Card>
  );
}

function DataTable({ columns, rows }) {
  return (
    <TableContainer sx={{ maxHeight: 360 }}>
      <Table size="small" stickyHeader>
        <TableHead>
          <TableRow>{columns.map((c) => <TableCell key={c.key} align={c.num ? 'right' : 'left'} sx={{ fontWeight: 600 }}>{c.label}</TableCell>)}</TableRow>
        </TableHead>
        <TableBody>
          {rows.map((r, i) => (
            <TableRow key={i} hover>
              {columns.map((c) => <TableCell key={c.key} align={c.num ? 'right' : 'left'} className={c.num ? 'num' : ''}>{c.fmt ? c.fmt(r[c.key], r) : r[c.key]}</TableCell>)}
            </TableRow>
          ))}
        </TableBody>
      </Table>
    </TableContainer>
  );
}

/* Horizontal bars: label | bar (value at tip). Whole row is the hover target. */
function HBars({ items, valueKey, fmt, color, tip, labelW = 150, highlight }) {
  const max = niceMax(Math.max(...items.map((d) => d[valueKey])));
  return (
    <Box role="list">
      {items.map((d) => {
        const ratio = Math.max(d[valueKey] / max, 0.006);
        return (
          <Tooltip key={d.name} title={tip ? tip(d) : `${d.name}: ${fmt(d[valueKey])}`} placement="top" arrow followCursor>
            <Box role="listitem" sx={{ display: 'flex', alignItems: 'center', gap: 1.25, py: '5px', borderRadius: 1, '&:hover': { bgcolor: 'action.hover' } }}>
              <Typography variant="body2" sx={{ width: { xs: Math.min(labelW, 112), sm: labelW }, flexShrink: 0, color: 'text.secondary', textAlign: 'right', lineHeight: 1.25, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {d.name}
              </Typography>
              <Box sx={{ flex: 1, display: 'flex', alignItems: 'center', gap: 1, minWidth: 0 }}>
                <Box sx={{ height: 18, width: `calc((100% - 84px) * ${ratio})`, bgcolor: color, opacity: highlight && !highlight(d) ? 0.45 : 1, borderRadius: '0 4px 4px 0', flexShrink: 0, transition: 'width .4s' }} />
                <Typography variant="body2" className="num" sx={{ whiteSpace: 'nowrap', color: 'text.primary', fontWeight: 500 }}>{fmt(d[valueKey])}</Typography>
              </Box>
            </Box>
          </Tooltip>
        );
      })}
    </Box>
  );
}

/* Vertical columns with a hairline baseline and clean y ticks. */
function Columns({ items, valueKey, fmt, color, colorOf, height = 180, tip, labelEvery = 1, peakLabel = true, refLine }) {
  const vals = items.map((d) => d[valueKey]);
  const max = niceMax(Math.max(...vals));
  const peak = Math.max(...vals);
  const ticks = [0, max / 2, max];
  return (
    <Box sx={{ display: 'flex', gap: 1 }}>
      <Box sx={{ position: 'relative', width: 40, height, flexShrink: 0 }}>
        {ticks.map((t) => (
          <Typography key={t} variant="caption" className="num" sx={{ position: 'absolute', right: 0, bottom: `calc(${(t / max) * 100}% - 8px)`, color: 'var(--muted)' }}>
            {t >= 1000 ? nf2.format(t / 1000) + 'K' : fmtN(t)}
          </Typography>
        ))}
      </Box>
      <Box sx={{ flex: 1, minWidth: 0 }}>
        <Box sx={{ position: 'relative', height, display: 'flex', alignItems: 'flex-end', gap: '2px', borderBottom: '1px solid var(--axis)' }}>
          {ticks.slice(1).map((t) => (
            <Box key={t} sx={{ position: 'absolute', left: 0, right: 0, bottom: `${(t / max) * 100}%`, borderTop: '1px solid var(--grid)' }} />
          ))}
          {refLine && (
            <Box sx={{ position: 'absolute', left: 0, right: 0, bottom: `${(refLine.value / max) * 100}%`, borderTop: '2px solid var(--ink2)', zIndex: 1, pointerEvents: 'none' }}>
              <Typography variant="caption" sx={{ position: 'absolute', right: 0, bottom: 2, color: 'text.secondary', bgcolor: 'background.paper', px: 0.5 }}>{refLine.label}</Typography>
            </Box>
          )}
          {items.map((d) => {
            const h = (d[valueKey] / max) * 100;
            const isPeak = peakLabel && d[valueKey] === peak;
            return (
              <Tooltip key={d.name} title={tip ? tip(d) : `${d.name}: ${fmt(d[valueKey])}`} placement="top" arrow>
                <Box sx={{ flex: 1, height: '100%', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', position: 'relative', cursor: 'default', '&:hover > .bar': { filter: 'brightness(1.12)' } }}>
                  {isPeak && (
                    <Typography variant="caption" className="num" sx={{ position: 'absolute', bottom: `calc(${h}% + 2px)`, fontWeight: 600, color: 'text.primary', whiteSpace: 'nowrap' }}>{fmt(d[valueKey])}</Typography>
                  )}
                  <Box className="bar" sx={{ width: '100%', maxWidth: 24, height: `${h}%`, bgcolor: colorOf ? colorOf(d) : color, borderRadius: '4px 4px 0 0', transition: 'height .4s' }} />
                </Box>
              </Tooltip>
            );
          })}
        </Box>
        <Box sx={{ display: 'flex', gap: '2px', mt: 0.5 }}>
          {items.map((d, i) => (
            <Typography key={d.name} variant="caption" sx={{ flex: 1, textAlign: 'center', color: 'var(--muted)', whiteSpace: 'nowrap', overflow: 'visible', visibility: i % labelEvery === 0 ? 'visible' : 'hidden' }}>{d.name}</Typography>
          ))}
        </Box>
      </Box>
    </Box>
  );
}

/* Tall segmented bar: one whole split into parts; legend lists names in block order. */
function SegBar({ items, valueKey, pal, fmtV = fmtN }) {
  const total = items.reduce((s, d) => s + d[valueKey], 0);
  return (
    <Box>
      <Box sx={{ display: 'flex', gap: '2px', height: 28 }} role="img" aria-label={items.map((d) => `${d.name} ${fmtPct(pct(d[valueKey], total))}`).join(', ')}>
        {items.map((d) => {
          const share = pct(d[valueKey], total);
          const c = pal[ENTITY_SLOT[d.name] ?? 7];
          return (
            <Tooltip key={d.name} title={`${d.name}: ${fmtV(d[valueKey])} (${fmtPct(share)})`} arrow placement="top">
              <Box sx={{ width: `${share}%`, bgcolor: c, borderRadius: '4px', display: 'flex', alignItems: 'center', pl: 1, overflow: 'hidden', minWidth: 2 }}>
                {share >= 9 && <Typography variant="caption" className="num" sx={{ color: INK_ON(c), fontWeight: 600, whiteSpace: 'nowrap' }}>{Math.round(share)}%</Typography>}
              </Box>
            </Tooltip>
          );
        })}
      </Box>
      <Stack direction="row" flexWrap="wrap" sx={{ mt: 1.5, columnGap: 2, rowGap: 0.75 }}>
        {items.map((d) => (
          <Stack key={d.name} direction="row" spacing={0.75} alignItems="center">
            <Box sx={{ width: 10, height: 10, borderRadius: '3px', bgcolor: pal[ENTITY_SLOT[d.name] ?? 7] }} />
            <Typography variant="body2" sx={{ color: 'text.secondary' }}>{d.name}{pct(d[valueKey], total) < 9 ? ` ${fmtPct(pct(d[valueKey], total))}` : ''}</Typography>
          </Stack>
        ))}
      </Stack>
    </Box>
  );
}

/* Line chart with crosshair + tooltip. series: [{name, color, values[12]}] */
function LineChart({ series, height = 260 }) {
  const ref = useRef(null);
  const [w, setW] = useState(640);
  const [hover, setHover] = useState(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setW(Math.max(280, e.contentRect.width)));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  const pad = { l: 52, r: 64, t: 16, b: 28 };
  const iw = w - pad.l - pad.r, ih = height - pad.t - pad.b;
  const all = series.flatMap((s) => s.values.filter((v) => v != null));
  const max = niceMax(Math.max(...all));
  const x = (i) => pad.l + (i / 11) * iw;
  const y = (v) => pad.t + ih - (v / max) * ih;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * max);
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * w;
    setHover(Math.max(0, Math.min(11, Math.round(((px - pad.l) / iw) * 11))));
  };
  return (
    <Box ref={ref} sx={{ position: 'relative', width: '100%' }}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} onMouseMove={onMove} onMouseLeave={() => setHover(null)} style={{ display: 'block', touchAction: 'pan-y' }}
        onTouchMove={(e) => onMove(e.touches[0] ? { currentTarget: e.currentTarget, clientX: e.touches[0].clientX } : e)}>
        {ticks.map((t) => (
          <g key={t}>
            <line x1={pad.l} x2={w - pad.r} y1={y(t)} y2={y(t)} stroke={t === 0 ? 'var(--axis)' : 'var(--grid)'} strokeWidth="1" />
            <text x={pad.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill="var(--muted)" className="num">{t === 0 ? '0' : (t / 1e3).toFixed(0) + 'K'}</text>
          </g>
        ))}
        {TH_MONTHS.map((m, i) => (w > 480 || i % 2 === 0) && (
          <text key={m} x={x(i)} y={height - 8} textAnchor="middle" fontSize="11" fill="var(--muted)">{m}</text>
        ))}
        {hover != null && <line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={pad.t + ih} stroke="var(--axis)" strokeWidth="1" />}
        {series.map((s) => {
          const pts = s.values.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
          const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
          const area = d + ` L${pts[pts.length - 1][0]} ${pad.t + ih} L${pts[0][0]} ${pad.t + ih} Z`;
          const last = pts[pts.length - 1];
          return (
            <g key={s.name}>
              {series.length === 1 && <path d={area} fill={s.color} opacity="0.1" />}
              <path d={d} fill="none" stroke={s.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
              <circle cx={last[0]} cy={last[1]} r="4" fill={s.color} stroke="var(--surface)" strokeWidth="2" />
              {series.length <= 2 && <text x={last[0] + 9} y={last[1] + 4} fontSize="12" fill="var(--ink2)" fontWeight="600">{s.name}</text>}
              {hover != null && s.values[hover] != null && (
                <circle cx={x(hover)} cy={y(s.values[hover])} r="5" fill={s.color} stroke="var(--surface)" strokeWidth="2" />
              )}
            </g>
          );
        })}
      </svg>
      {hover != null && (
        <Box sx={{ position: 'absolute', top: 8, left: `${(x(hover) / w) * 100}%`, transform: x(hover) > w * 0.6 ? 'translateX(calc(-100% - 12px))' : 'translateX(12px)', bgcolor: 'background.paper', border: '1px solid var(--ring)', borderRadius: 2, boxShadow: 3, px: 1.5, py: 1, pointerEvents: 'none', minWidth: 150 }}>
          <Typography variant="caption" sx={{ color: 'text.secondary', fontWeight: 600 }}>{TH_MONTHS[hover]}</Typography>
          {series.map((s) => s.values[hover] != null && (
            <Stack key={s.name} direction="row" spacing={1} alignItems="center" justifyContent="space-between">
              <Stack direction="row" spacing={0.75} alignItems="center">
                <Box sx={{ width: 12, height: 2, bgcolor: s.color, borderRadius: 1 }} />
                <Typography variant="body2" sx={{ color: 'text.secondary' }}>{s.name}</Typography>
              </Stack>
              <Typography variant="body2" className="num" sx={{ fontWeight: 600 }}>{fmtB(s.values[hover])}</Typography>
            </Stack>
          ))}
        </Box>
      )}
      {series.length > 1 && (
        <Stack direction="row" spacing={2} sx={{ mt: 1, pl: `${pad.l}px` }}>
          {series.map((s) => (
            <Stack key={s.name} direction="row" spacing={0.75} alignItems="center">
              <Box sx={{ width: 16, height: 2, bgcolor: s.color, borderRadius: 1 }} />
              <Typography variant="body2" sx={{ color: 'text.secondary' }}>ปี {s.name}</Typography>
            </Stack>
          ))}
        </Stack>
      )}
    </Box>
  );
}

function StatTile({ label, value, sub, icon, hero }) {
  return (
    <Card variant="outlined" sx={{ height: '100%', borderRadius: 3 }}>
      <CardContent sx={{ p: { xs: 2, sm: 2.5 } }}>
        <Stack direction="row" spacing={1} alignItems="center" sx={{ color: 'text.secondary', mb: 0.75 }}>
          <Icon fontSize="small">{icon}</Icon>
          <Typography variant="body2">{label}</Typography>
        </Stack>
        <Typography sx={{ fontFamily: 'Prompt', fontWeight: 600, fontSize: hero ? { xs: 36, sm: 48 } : { xs: 22, sm: 26 }, lineHeight: 1.15 }}>{value}</Typography>
        {sub && <Typography variant="body2" sx={{ color: 'text.secondary', mt: 0.5 }}>{sub}</Typography>}
      </CardContent>
    </Card>
  );
}

/* ---------- data-quality section ---------- */
function QualitySection({ pal }) {
  const c = Q.checks;
  const checks = [
    { label: 'รหัสคำสั่งซื้อซ้ำ', n: c.dupId },
    { label: 'แถวซ้ำกันทุกช่อง (ยกเว้นรหัส)', n: c.dupRow },
    { label: 'ยอดก่อนค่าส่ง ≠ ราคา × จำนวน − ส่วนลด', n: c.mathSub },
    { label: 'ยอดสุทธิ ≠ ยอดก่อนค่าส่ง + ค่าส่ง', n: c.mathTotal },
    { label: 'วันที่/เวลาผิดรูปแบบ', n: c.badDateTime },
    { label: 'จังหวัดอยู่ผิดภาค', n: c.provRegion },
    { label: 'สินค้าอยู่หลายหมวด', n: c.prodCat },
    { label: 'ลูกค้าคนเดิมแต่เพศ/อายุ/จังหวัดไม่ตรงกัน', n: c.custAttr },
    { label: 'ซื้อหน้าร้านแต่มีค่าส่ง/วันจัดส่ง', n: c.storeShip },
    { label: 'ซื้อออนไลน์แต่จ่าย "เงินสด"', n: c.cashOnline },
    { label: 'คำสั่งซื้อที่ยกเลิกแต่มีรีวิว', n: c.cancelReview },
    { label: 'ซื้อหน้าร้านแต่จ่าย "เก็บเงินปลายทาง"', n: c.codStore, junk: true },
  ];
  const sampleCols = [
    { key: 'id', label: 'รหัสคำสั่งซื้อ' }, { key: 'date', label: 'วันที่' }, { key: 'product', label: 'สินค้า' },
    { key: 'channel', label: 'ช่องทาง' }, { key: 'pay', label: 'วิธีชำระ' },
    { key: 'ship', label: 'ค่าส่ง', num: true, fmt: fmtN }, { key: 'days', label: 'วันจัดส่ง', num: true },
    { key: 'total', label: 'ยอดสุทธิ', num: true, fmt: fmtB }, { key: 'status', label: 'สถานะ' },
  ];
  return (
    <Section id="quality" icon="cleaning_services" title="การคัดกรองข้อมูล (Data Cleaning)"

const TYPE_KEYS = ['P', 'G', 'A', 'R'];
const TYPE_FIELD = { P: 'pay', G: 'gender', A: 'age', R: 'review' };
const TYPE_SHORT = { P: 'จ่ายเงินขัดแย้ง', G: 'เพศไม่ระบุ', A: 'อายุ 15 (ปัด)', R: 'รีวิวว่าง' };
const TYPE_ICON = { P: 'credit_card_off', G: 'help_outline', A: 'person_off', R: 'star_border' };

function MiniStat({ label, value, sub }) {
  return (
    <Box sx={{ p: 1.5, borderRadius: 2, border: '1px solid var(--ring)', height: '100%' }}>
      <Typography variant="body2" sx={{ color: 'text.secondary' }}>{label}</Typography>
      <Typography sx={{ fontFamily: 'Prompt', fontWeight: 600, fontSize: 22, lineHeight: 1.2 }} className="num">{value}</Typography>
      {sub && <Typography variant="caption" sx={{ color: 'text.secondary' }}>{sub}</Typography>}
    </Box>
  );
}

function SubHead({ children }) {
  return <Typography variant="subtitle2" sx={{ fontWeight: 600, mt: 2.5, mb: 1 }}>{children}</Typography>;
}

function TypeDetail({ t, pal }) {
  const T = J.types[t];
  const color = pal[TYPE_KEYS.indexOf(t)];
  const ctx = T.context;
  const monthItems = J.months.map((m, i) => ({ name: `${TH_MONTHS[+m.slice(5) - 1]}${m.slice(2, 4)}`, full: `${TH_MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}`, n: T.monthly[i] }));
  const nCols = [{ key: 'name', label: 'กลุ่ม' }, { key: 'n', label: 'จำนวนช่อง', num: true, fmt: fmtN }];
  const tipN = (d) => `${d.name}: ${fmtN(d.n)} ช่อง (${fmtPct(pct(d.n, T.cells))})`;

  let why = null, extra = null;
  if (t === 'P') {
    why = <>ช่องทาง “หน้าร้าน” ทุกแถวในไฟล์มีค่าส่ง 0 บาทและวันจัดส่ง 0 วัน แปลว่าลูกค้ารับของที่ร้าน แต่มี {fmtN(T.cells)} แถวที่บันทึกวิธีชำระว่า “เก็บเงินปลายทาง” (จ่ายเงินตอนพนักงานส่งของถึงบ้าน) ซึ่งเกิดพร้อมกันไม่ได้ เราไม่รู้ว่าช่องไหนผิด ช่องทางหรือวิธีชำระ จึงเชื่อถือทั้งแถวไม่ได้ และตัดทั้งแถวออก</>;
    extra = (
      <>
        <SubHead>วิธีชำระของคำสั่งซื้อหน้าร้านทั้งหมด ({fmtN(ctx.storeOrders)} รายการ ในไฟล์ดิบ)</SubHead>
        <HBars items={ctx.storePay.map((d) => ({ ...d }))} valueKey="n" fmt={fmtN} color={color} labelW={130}
          highlight={(d) => d.name === 'เก็บเงินปลายทาง'} tip={(d) => `${d.name}: ${fmtN(d.n)} รายการ (${fmtPct(pct(d.n, ctx.storeOrders))})`} />
        <Typography variant="body2" sx={{ color: 'text.secondary', mt: 1 }}>
          แท่งทึบคือแถวขยะ: {fmtPct(pct(T.cells, ctx.storeOrders))} ของรายการหน้าร้าน ส่วนช่องทางออนไลน์ใช้ “เก็บเงินปลายทาง” ได้ตามปกติ ({fmtN(ctx.onlineCod)} จาก {fmtN(ctx.onlineOrders)} รายการ)
          · ยอดเงินในแถวที่ตัดทิ้งรวม {fmtB(ctx.allRevenue)} (เฉพาะที่สถานะสำเร็จ {fmtB(T.revenue)})
        </Typography>
      </>
    );
  } else if (t === 'A') {
    why = <>ถ้าอายุลูกค้ากระจายแบบปกติ จำนวนคนอายุ 15 ควรใกล้เคียงอายุ 16–18 (เฉลี่ย ~{ctx.expected} คน) แต่มีถึง {ctx.customers15} คน เกินมา ~{ctx.excess} คน แสดงว่าระบบปัดอายุที่น้อยกว่า 15 ขึ้นเป็น 15 (หรือใช้ 15 เป็นค่าเริ่มต้นเมื่อไม่กรอก) เราบอกไม่ได้ว่าใครอายุ 15 จริง ทั้ง {fmtN(T.cells)} ช่อง ({ctx.customers15} คน) จึงเป็นค่าที่น่าสงสัย</>;
    extra = (
      <>
        <SubHead>จำนวนลูกค้าตามอายุ 15–30 ปี (นับคนไม่ซ้ำ)</SubHead>
        <Columns items={ctx.ageHist} valueKey="n" fmt={(v) => fmtN(v) + ' คน'} color={pal[0]} colorOf={(d) => d.name === '15' ? color : 'var(--axis)'} height={170}
          refLine={{ value: ctx.expected, label: `ค่าที่ควรเป็น ≈ ${ctx.expected}` }} tip={(d) => `อายุ ${d.name}: ${fmtN(d.n)} คน`} />
        <Typography variant="body2" sx={{ color: 'text.secondary', mt: 1 }}>
          ข้อสังเกตเพิ่ม: ลูกค้าอายุ 15 ปีจ่ายด้วยบัตรเครดิต {fmtN(ctx.credit15)} รายการ ทั้งที่ในไทยคนอายุต่ำกว่า 20 ปีถือบัตรเครดิตหลักไม่ได้ จึงยิ่งชี้ว่าอายุ 15 ไม่ใช่อายุจริงทั้งหมด
        </Typography>
      </>
    );
  } else if (t === 'G') {
    why = <>ช่องเพศถูกกรอกว่า “ไม่ระบุ” {fmtN(T.cells)} ช่อง จากลูกค้า {ctx.customers} คน ลูกค้าคนเดิมเป็น “ไม่ระบุ” ทุกคำสั่งซื้อ ไม่ใช่สลับไปมา เป็นข้อมูลที่ขาดหาย ไม่ใช่ข้อมูลผิด จึงเก็บไว้แล้วแยกเป็นกลุ่มของตัวเอง ไม่เดาเพศแทน</>;
    extra = (
      <Grid container spacing={2}>
        <Grid item xs={12} md={6}>
          <SubHead>เพศของลูกค้าทั้งหมด ({fmtN(ctx.allCustomers)} คน)</SubHead>
          <SegBar items={ctx.genderCustomers} valueKey="n" pal={pal} fmtV={(v) => fmtN(v) + ' คน'} />
        </Grid>
        <Grid item xs={12} md={6}>
          <SubHead>ช่วงอายุของลูกค้าที่ไม่ระบุเพศ ({ctx.customers} คน)</SubHead>
          <HBars items={ctx.ageOfUnknown} valueKey="n" fmt={(v) => fmtN(v) + ' คน'} color={color} labelW={60} />
        </Grid>
      </Grid>
    );
  } else if (t === 'R') {
    why = <>คะแนนรีวิวว่างทั้งหมด {fmtN(ctx.blankAll)} ช่อง แต่ {fmtN(ctx.blankCancelled)} ช่องเป็นคำสั่งซื้อที่ยกเลิก (ยกเลิกทั้งหมด {fmtN(ctx.cancelledAll)} รายการ ว่าง 100%) ซึ่งไม่ได้รับของ จึงไม่มีรีวิวเป็นเรื่องปกติ ที่เหลือ {fmtN(T.cells)} ช่องเป็นคำสั่งซื้อที่ได้รับของแล้วแต่ไม่มีคะแนน ถือว่าข้อมูลหาย ไม่นำมาเฉลี่ย และไม่นับเป็น 0 คะแนน (ถ้านับเป็น 0 ค่าเฉลี่ยจะต่ำผิดจริง)</>;
    extra = (
      <Grid container spacing={2}>
        <Grid item xs={12} md={6}>
          <SubHead>อัตรารีวิวว่างตามสถานะ</SubHead>
          <DataTable columns={[{ key: 'name', label: 'สถานะ' }, { key: 'blank', label: 'ว่าง', num: true, fmt: fmtN }, { key: 'total', label: 'ทั้งหมด', num: true, fmt: fmtN },
            { key: 'rate', label: 'อัตราว่าง', num: true, fmt: (v, r) => fmtPct(pct(r.blank, r.total)) }]} rows={ctx.rateByStatus} />
        </Grid>
        <Grid item xs={12} md={6}>
          <SubHead>อัตรารีวิวว่างตามช่องทาง (ไม่รวมยกเลิก)</SubHead>
          <DataTable columns={[{ key: 'name', label: 'ช่องทาง' }, { key: 'blank', label: 'ว่าง', num: true, fmt: fmtN }, { key: 'total', label: 'ทั้งหมด', num: true, fmt: fmtN },
            { key: 'rate', label: 'อัตราว่าง', num: true, fmt: (v, r) => fmtPct(pct(r.blank, r.total)) }]} rows={ctx.rateByChannel} />
        </Grid>
      </Grid>
    );
  }

  return (
    <Box>
      <Alert severity={t === 'P' ? 'error' : 'warning'} icon={<Icon>{TYPE_ICON[t]}</Icon>} sx={{ mb: 2 }}>
        <b>{T.title}</b> · คอลัมน์ “{T.col}” · {T.kind} → {T.action}<br />{why}
      </Alert>
      <Grid container spacing={1.5}>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="จำนวนช่อง" value={fmtN(T.cells)} sub={`${fmtPct(T.pctRows, 2)} ของแถว`} /></Grid>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="ลูกค้าที่เกี่ยวข้อง" value={fmtN(T.customers)} sub="คน" /></Grid>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="ปี 2024" value={fmtN(T.y2024)} sub="ช่อง" /></Grid>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="ปี 2025" value={fmtN(T.y2025)} sub="ช่อง" /></Grid>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="ยอดเงินที่เกี่ยวข้อง" value={fmtCompactB(T.revenue)} sub="เฉพาะสถานะสำเร็จ" /></Grid>
        <Grid item xs={6} sm={4} md={2}><MiniStat label="เฉลี่ยต่อเดือน" value={nf2.format(T.cells / 24)} sub="ช่อง/เดือน" /></Grid>
      </Grid>
      {extra}
      <SubHead>จำนวนช่องที่พบรายเดือน (ม.ค. 2024 – ธ.ค. 2025)</SubHead>
      <Columns items={monthItems} valueKey="n" fmt={fmtN} color={color} height={140} labelEvery={3} tip={(d) => `${d.full}: ${fmtN(d.n)} ช่อง`} />
      <Grid container spacing={2} sx={{ mt: 0 }}>
        <Grid item xs={12} md={6}>
          <SubHead>ตามช่องทางการขาย</SubHead>
          <HBars items={T.channel} valueKey="n" fmt={fmtN} color={color} labelW={110} tip={tipN} />
          <SubHead>ตามสถานะคำสั่งซื้อ</SubHead>

        <Grid item xs={12} md={6}>

      <Stack direction="row" flexWrap="wrap" useFlexGap spacing={1}>

      </Stack>

function CellList({ pal }) {
  const [type, setType] = useState('all');
  const [q, setQ] = useState('');
  const [page, setPage] = useState(0);
  const [rpp, setRpp] = useState(25);
  const f = J.fields;
  const idx = Object.fromEntries(f.map((k, i) => [k, i]));
  const rows = useMemo(() => {
    const s = q.trim().toLowerCase();
    return J.records.filter((r) => (type === 'all' || r[0] === type) && (!s || r.slice(1, 12).some((v) => String(v).toLowerCase().includes(s))));
  }, [type, q]);
  useEffect(() => setPage(0), [type, q]);
  const download = () => {
    const head = ['ประเภทขยะ', 'คอลัมน์ที่ผิดปกติ', 'รหัสคำสั่งซื้อ', 'วันที่', 'รหัสลูกค้า', 'เพศ', 'อายุ', 'จังหวัด', 'ช่องทาง', 'สินค้า', 'วิธีชำระเงิน', 'สถานะ', 'คะแนนรีวิว', 'ยอดรวมสุทธิ', 'จำนวนจุดในแถวนี้'];
    const esc = (v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const lines = [head.join(',')].concat(rows.map((r) => [J.types[r[0]].title, J.types[r[0]].col, ...r.slice(1)].map(esc).join(',')));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `junk_cells_${type}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const cell = (r, key) => {
    const bad = TYPE_FIELD[r[0]] === key;
    let v = r[idx[key]];
    if (key === 'review' && v === '') v = '— ว่าง —';
    if (key === 'total') v = fmtB(v);
    return (
      <TableCell key={key} align={key === 'total' || key === 'age' ? 'right' : 'left'} className={key === 'total' || key === 'age' ? 'num' : ''}
        sx={{ whiteSpace: 'nowrap', ...(bad ? { bgcolor: r[0] === 'P' ? 'rgba(208,59,59,0.16)' : 'rgba(250,178,25,0.22)', fontWeight: 700 } : {}) }}>{v}</TableCell>
    );
  };
  const shown = rows.slice(page * rpp, page * rpp + rpp);
  return (
    <Card variant="outlined" sx={{ borderRadius: 3 }}>
      <CardContent sx={{ p: { xs: 2, sm: 2.5 } }}>
        <Typography variant="subtitle1" component="h3" sx={{ fontWeight: 600 }}>รายการช่องขยะทั้งหมด {fmtN(J.junkCells)} ช่อง</Typography>
        <Typography variant="body2" sx={{ color: 'text.secondary', mb: 1.5 }}>ช่องที่ผิดปกติถูกไฮไลต์ไว้ (แดง = ผิด/ตัดออก, เหลือง = หาย/น่าสงสัย) · ค้นหาด้วยรหัสคำสั่งซื้อ รหัสลูกค้า จังหวัด สินค้า ฯลฯ</Typography>
        <Stack direction={{ xs: 'column', md: 'row' }} spacing={1.5} alignItems={{ md: 'center' }} sx={{ mb: 1.5 }}>
          <ToggleButtonGroup size="small" exclusive value={type} onChange={(e, v) => v && setType(v)} sx={{ flexWrap: 'wrap' }}>
            <ToggleButton value="all">ทั้งหมด ({fmtN(J.junkCells)})</ToggleButton>
            {TYPE_KEYS.map((k) => <ToggleButton key={k} value={k}>{TYPE_SHORT[k]} ({fmtN(J.types[k].cells)})</ToggleButton>)}
          </ToggleButtonGroup>
          <TextField size="small" placeholder="ค้นหา…" value={q} onChange={(e) => setQ(e.target.value)} sx={{ flex: 1, minWidth: 160 }}
            InputProps={{ startAdornment: <InputAdornment position="start"><Icon fontSize="small">search</Icon></InputAdornment> }} />
          <Button variant="outlined" size="small" onClick={download} startIcon={<Icon>download</Icon>} className="no-print" sx={{ flexShrink: 0 }}>CSV ({fmtN(rows.length)})</Button>
        </Stack>
        <TableContainer sx={{ maxHeight: 560 }}>
          <Table size="small" stickyHeader>
            <TableHead>
              <TableRow>
                {['ประเภท', 'รหัสคำสั่งซื้อ', 'วันที่', 'ลูกค้า', 'เพศ', 'อายุ', 'จังหวัด', 'ช่องทาง', 'สินค้า', 'วิธีชำระ', 'สถานะ', 'รีวิว', 'ยอดสุทธิ', 'จุดในแถว'].map((h, i) => (
                  <TableCell key={h} align={[5, 12, 13].includes(i) ? 'right' : 'left'} sx={{ fontWeight: 600, whiteSpace: 'nowrap' }}>{h}</TableCell>
                ))}
              </TableRow>
            </TableHead>
            <TableBody>
              {shown.map((r, i) => (
                <TableRow key={r[0] + r[1]} hover>
                  <TableCell><Chip size="small" label={TYPE_SHORT[r[0]]} sx={{ bgcolor: pal[TYPE_KEYS.indexOf(r[0])], color: INK_ON(pal[TYPE_KEYS.indexOf(r[0])]), fontWeight: 600 }} /></TableCell>
                  {['id', 'date', 'customer', 'gender', 'age', 'province', 'channel', 'product', 'pay', 'status', 'review', 'total'].map((k) => cell(r, k))}
                  <TableCell align="right" className="num">{r[13] > 1 ? <Chip size="small" color="warning" label={r[13]} /> : r[13]}</TableCell>
                </TableRow>
              ))}
              {!shown.length && <TableRow><TableCell colSpan={14} align="center" sx={{ py: 4, color: 'text.secondary' }}>ไม่พบรายการ</TableCell></TableRow>}
            </TableBody>
          </Table>
        </TableContainer>
        <TablePagination component="div" count={rows.length} page={page} onPageChange={(e, p) => setPage(p)} rowsPerPage={rpp}
          onRowsPerPageChange={(e) => { setRpp(+e.target.value); setPage(0); }} rowsPerPageOptions={[25, 50, 100, 250]}
          labelRowsPerPage="แถวต่อหน้า" labelDisplayedRows={({ from, to, count }) => `${fmtN(from)}–${fmtN(to)} จาก ${fmtN(count)}`} />
      </CardContent>
    </Card>
  );
}

/* ---------- app ---------- */
function App() {
  const prefersDark = useMediaQuery('(prefers-color-scheme: dark)');
  const [year, setYear] = useState('all');
  const mode = prefersDark ? 'dark' : 'light';
  const pal = PAL[mode];
  const theme = useMemo(() => createTheme({
    palette: {
      mode,
      primary: { main: pal[0] },
      background: { default: mode === 'dark' ? '#0d0d0d' : '#f4f4f1', paper: mode === 'dark' ? '#1a1a19' : '#fcfcfb' },
      text: mode === 'dark' ? { primary: '#f0efec', secondary: '#c3c2b7' } : { primary: '#0b0b0b', secondary: '#52514e' },
      divider: mode === 'dark' ? '#2c2c2a' : '#e1e0d9',
    },
    shape: { borderRadius: 10 },
    typography: {
      fontFamily: "'Sarabun', system-ui, sans-serif",
      h4: { fontFamily: "'Prompt', sans-serif", fontWeight: 600 },
      h5: { fontFamily: "'Prompt', sans-serif", fontWeight: 600 },
      subtitle1: { fontFamily: "'Prompt', sans-serif" },
      button: { fontFamily: "'Prompt', sans-serif", textTransform: 'none' },
    },
    components: { MuiCard: { styleOverrides: { root: { borderColor: 'var(--ring)' } } } },
  }), [mode]);

  const Y = D.byYear[year];
  const K = Y.kpi;
  const yearLabel = year === 'all' ? '2024–2025' : year;

  const lineSeries = useMemo(() => {
    const toArr = (key) => { const a = Array(12).fill(null); D.byYear[key].monthly.forEach((m) => { a[+m.m.slice(5) - 1] = m.revenue; }); return a; };
    if (year === 'all') return [{ name: '2024', color: pal[0], values: toArr('2024') }, { name: '2025', color: pal[1], values: toArr('2025') }];
    return [{ name: year, color: year === '2024' ? pal[0] : pal[1], values: toArr(year) }];
  }, [year, mode]);

  const bestMonth = [...Y.monthly].sort((a, b) => b.revenue - a.revenue)[0];
  const peakHour = [...Y.hour].sort((a, b) => b.orders - a.orders)[0];
  const growth = pct(D.byYear['2025'].kpi.revenue - D.byYear['2024'].kpi.revenue, D.byYear['2024'].kpi.revenue);
  const weekend = Y.weekday.slice(5).reduce((s, d) => s + d.orders, 0) / 2;
  const weekdayAvg = Y.weekday.slice(0, 5).reduce((s, d) => s + d.orders, 0) / 5;
  const monthName = (m) => `${TH_MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}`;

  const insights = [
    { icon: 'trending_up', text: <>ยอดขายปี 2025 โต <b>{fmtPct(growth)}</b> จากปี 2024 ({fmtCompactB(D.byYear['2024'].kpi.revenue)} → {fmtCompactB(D.byYear['2025'].kpi.revenue)})</> },
    { icon: 'event', text: <>เดือนที่ขายดีที่สุดคือ <b>{monthName(bestMonth.m)}</b> ({fmtB(bestMonth.revenue)}) ยอดขายพุ่งช่วงโปรฯ 11.11 และ 12.12</> },
    { icon: 'devices', text: <><b>{Y.category[0].name}</b> ทำรายได้สูงสุด {fmtPct(pct(Y.category[0].revenue, K.revenue))} ของยอดขาย ช่องทางหลักคือ <b>{[...Y.channel].sort((a, b) => b.revenue - a.revenue)[0].name}</b></> },
    { icon: 'schedule', text: <>ลูกค้าสั่งมากที่สุดช่วง <b>{peakHour.name}:00 น.</b> และวันเสาร์–อาทิตย์สั่งมากกว่าวันธรรมดาเฉลี่ย {fmtPct(pct(weekend - weekdayAvg, weekdayAvg), 0)}</> },
    { icon: 'local_shipping', text: <>จัดส่งเร็วสุดใน<b>ภาคกลาง</b> (เฉลี่ย {Y.delivery[0].avg} วัน) ช้าสุดคือ<b>{[...Y.delivery].sort((a, b) => b.avg - a.avg)[0].name}</b> ({[...Y.delivery].sort((a, b) => b.avg - a.avg)[0].avg} วัน)</> },
  ];

  const revCols = (label) => [
    { key: 'name', label }, { key: 'orders', label: 'คำสั่งซื้อ', num: true, fmt: fmtN },
    { key: 'units', label: 'ชิ้น', num: true, fmt: fmtN }, { key: 'revenue', label: 'ยอดขาย', num: true, fmt: fmtB },
  ];
  const revTip = (d) => `${d.name}: ${fmtB(d.revenue)} · ${fmtN(d.orders)} คำสั่งซื้อ`;

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <AppBar position="sticky" elevation={0} color="inherit" sx={{ borderBottom: '1px solid', borderColor: 'divider', bgcolor: 'background.paper' }}>
        <Toolbar sx={{ gap: 1.5, flexWrap: 'wrap', py: { xs: 1, sm: 0 } }}>
          <Icon sx={{ color: 'primary.main' }}>insights</Icon>
          <Typography sx={{ fontFamily: 'Prompt', fontWeight: 600, flexGrow: 1, fontSize: { xs: 16, sm: 19 } }}>รายงานข้อมูลการขาย</Typography>
          <ToggleButtonGroup size="small" exclusive value={year} onChange={(e, v) => v && setYear(v)} aria-label="เลือกปี" className="no-print">
            <ToggleButton value="all" sx={{ px: 1.5 }}>ทั้งหมด</ToggleButton>
            <ToggleButton value="2024" sx={{ px: 1.5 }}>2024</ToggleButton>
            <ToggleButton value="2025" sx={{ px: 1.5 }}>2025</ToggleButton>
          </ToggleButtonGroup>
        </Toolbar>
      </AppBar>

      <Container maxWidth="lg" sx={{ py: { xs: 3, sm: 4 }, px: { xs: 2, sm: 3 } }}>
        <Typography variant="h4" component="h1" sx={{ fontSize: { xs: 26, sm: 34 } }}>ข้อมูลการขายปลีกหลายช่องทาง ปี {yearLabel}</Typography>
        <Typography sx={{ color: 'text.secondary', mt: 1, maxWidth: 820 }}>
          วิเคราะห์จากไฟล์ <b>sales_data.csv</b> ({fmtN(Q.rawRows)} คำสั่งซื้อ · 7 หมวดสินค้า · 33 รายการ · 25 จังหวัด · 4 ช่องทางขาย)
          หลังคัดข้อมูลขยะออกเหลือ <b>{fmtN(Q.cleanRows)}</b> คำสั่งซื้อ ตัวเลขยอดขายนับเฉพาะคำสั่งซื้อที่ “สำเร็จ”
        </Typography>
        <Paper variant="outlined" sx={{ mt: 3, p: { xs: 2, sm: 3 }, borderRadius: 3, borderWidth: 2, borderColor: 'error.main', bgcolor: mode === 'dark' ? 'rgba(208,59,59,0.10)' : 'rgba(208,59,59,0.05)' }}>
          <Grid container spacing={2} alignItems="center">
            <Grid item xs={12} md={4}>
              <Stack direction="row" spacing={1} alignItems="center" sx={{ color: 'error.main', mb: 0.5 }}>
                <Icon>report</Icon>
                <Typography sx={{ fontFamily: 'Prompt', fontWeight: 600 }}>ข้อมูลขยะที่พบในไฟล์</Typography>
              </Stack>
              <Typography sx={{ fontFamily: 'Prompt', fontWeight: 700, fontSize: { xs: 44, sm: 56 }, lineHeight: 1.1 }}>
                4 จุด
              </Typography>
              <Typography sx={{ fontFamily: 'Prompt', fontWeight: 600, fontSize: { xs: 20, sm: 24 } }} className="num">
                รวม {fmtN(J.junkCells)} ช่อง
              </Typography>
              <Typography variant="body2" sx={{ color: 'text.secondary', mt: 0.5 }}>
                จากทั้งหมด {fmtN(J.cellsTotal)} ช่อง ({fmtPct(pct(J.junkCells, J.cellsTotal), 2)}) · อยู่ใน {fmtN(J.rowsTouched)} แถว
              </Typography>
            </Grid>
            <Grid item xs={12} md={8}>
              <Grid container spacing={1.5}>
                {TYPE_KEYS.map((k, i) => (
                  <Grid item xs={12} sm={6} key={k}>
                    <Box component="a" href={`?tab=${k}#cells`} sx={{ display: 'flex', gap: 1.5, alignItems: 'center', p: 1.5, borderRadius: 2, bgcolor: 'background.paper', border: '1px solid var(--ring)', textDecoration: 'none', color: 'inherit', height: '100%', '&:hover': { borderColor: 'error.main' } }}>
                      <Box sx={{ width: 36, height: 36, borderRadius: '50%', bgcolor: pal[i], color: INK_ON(pal[i]), display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Prompt', fontWeight: 700, flexShrink: 0 }}>{i + 1}</Box>
                      <Box sx={{ minWidth: 0, flex: 1 }}>
                        <Typography variant="body2" sx={{ fontWeight: 600, lineHeight: 1.3 }}>{J.types[k].title}</Typography>
                        <Typography variant="caption" sx={{ color: 'text.secondary' }}>คอลัมน์ “{J.types[k].col}” · {J.types[k].action}</Typography>
                      </Box>
                      <Box sx={{ textAlign: 'right', flexShrink: 0 }}>
                        <Typography sx={{ fontFamily: 'Prompt', fontWeight: 700, fontSize: 20, lineHeight: 1.1 }} className="num">{fmtN(J.types[k].cells)}</Typography>
                        <Typography variant="caption" sx={{ color: 'text.secondary' }}>ช่อง</Typography>
                      </Box>
                    </Box>
                  </Grid>
                ))}
              </Grid>
            </Grid>
          </Grid>
        </Paper>
        <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap sx={{ mt: 2 }} className="no-print">
          {[['quality', 'การคัดกรองข้อมูล'], ['cells', 'จุดขยะรายช่อง'], ['overview', 'ภาพรวม'], ['products', 'สินค้า'], ['channels', 'ช่องทาง & พื้นที่'], ['customers', 'ลูกค้า'], ['time', 'ช่วงเวลา'], ['service', 'ความพึงพอใจ']].map(([id, l]) => (
            <Chip key={id} label={l} component="a" href={`#${id}`} clickable variant="outlined" size="small" />
          ))}
        </Stack>

        <QualitySection pal={pal} />
        <JunkCellsSection pal={pal} />

        <Section id="overview" icon="dashboard" title={`ภาพรวม ปี ${yearLabel}`}>
          <Grid container spacing={2}>
            <Grid item xs={12} md={4}>
              <StatTile hero icon="payments" label="ยอดขายสุทธิ (สำเร็จ)" value={fmtCompactB(K.revenue)} sub={`${fmtB(K.revenue)} · รวมค่าส่ง ${fmtB(K.shipping)}`} />
            </Grid>
            <Grid item xs={12} md={8}>
              <Grid container spacing={2}>
                <Grid item xs={6} sm={4}><StatTile icon="receipt_long" label="คำสั่งซื้อสำเร็จ" value={fmtN(K.success)} sub={`จาก ${fmtN(K.orders)} รายการ`} /></Grid>
                <Grid item xs={6} sm={4}><StatTile icon="shopping_basket" label="ยอดเฉลี่ยต่อบิล" value={fmtB(K.aov)} /></Grid>
                <Grid item xs={6} sm={4}><StatTile icon="group" label="ลูกค้า" value={fmtN(K.customers)} sub="คน (ไม่ซ้ำ)" /></Grid>
                <Grid item xs={6} sm={4}><StatTile icon="inventory_2" label="สินค้าที่ขายได้" value={fmtN(K.units)} sub="ชิ้น" /></Grid>
                <Grid item xs={6} sm={4}><StatTile icon="star" label="คะแนนรีวิวเฉลี่ย" value={`${K.rating.toFixed(2)} / 5`} sub={`จาก ${fmtN(K.ratedCount)} รีวิว`} /></Grid>
                <Grid item xs={6} sm={4}><StatTile icon="undo" label="ยกเลิก / คืนสินค้า" value={`${fmtPct(pct(K.cancelled, K.orders))} / ${fmtPct(pct(K.returned, K.orders))}`} sub={`${fmtN(K.cancelled)} / ${fmtN(K.returned)} รายการ`} /></Grid>
              </Grid>
            </Grid>
            <Grid item xs={12}>
              <ChartCard title="ยอดขายรายเดือน (บาท)" note={year === 'all' ? 'เทียบปี 2024 กับ 2025 · ชี้เมาส์เพื่อดูตัวเลข' : `ปี ${year} · ชี้เมาส์เพื่อดูตัวเลข`}
                table={{ columns: [{ key: 'm', label: 'เดือน', fmt: monthName }, { key: 'revenue', label: 'ยอดขาย', num: true, fmt: fmtB }], rows: Y.monthly }}>
                <LineChart series={lineSeries} />
              </ChartCard>
            </Grid>
            <Grid item xs={12}>
              <Card variant="outlined" sx={{ borderRadius: 3 }}>
                <CardContent sx={{ p: { xs: 2, sm: 2.5 } }}>
                  <Typography variant="subtitle1" component="h3" sx={{ fontWeight: 600, mb: 1.5 }}>ข้อค้นพบสำคัญ</Typography>
                  <Grid container spacing={1.5}>
                    {insights.map((n, i) => (
                      <Grid item xs={12} sm={6} key={i}>
                        <Stack direction="row" spacing={1.25} alignItems="flex-start">
                          <Icon sx={{ color: 'primary.main', mt: '1px' }}>{n.icon}</Icon>
                          <Typography variant="body2">{n.text}</Typography>
                        </Stack>
                      </Grid>
                    ))}
                  </Grid>
                </CardContent>
              </Card>
            </Grid>
          </Grid>
        </Section>

        <Section id="products" icon="category" title="สินค้า">
          <Grid container spacing={2}>
            <Grid item xs={12} md={6}>
              <ChartCard title="ยอดขายตามหมวดสินค้า" table={{ columns: revCols('หมวด'), rows: Y.category }}>
                <HBars items={Y.category} valueKey="revenue" fmt={fmtCompactB} color={pal[0]} tip={revTip} labelW={150} />
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={6}>
              <ChartCard title="สินค้าขายดี 10 อันดับ (ตามยอดขาย)" table={{ columns: revCols('สินค้า'), rows: Y.product }}>
                <HBars items={Y.product} valueKey="revenue" fmt={fmtCompactB} color={pal[0]} tip={(d) => `${revTip(d)} · ${fmtN(d.units)} ชิ้น`} labelW={170} />
              </ChartCard>
            </Grid>
            <Grid item xs={12}>
              <ChartCard title="จำนวนคำสั่งซื้อตามส่วนลดที่ได้รับ" note={`ให้ส่วนลดไปทั้งหมด ${fmtB(K.discountGiven)} · ${fmtPct(pct(K.success - Y.discount[0].orders, K.success))} ของบิลได้ส่วนลด`}
                table={{ columns: [{ key: 'name', label: 'ส่วนลด' }, { key: 'orders', label: 'คำสั่งซื้อ', num: true, fmt: fmtN }], rows: Y.discount }}>
                <Columns items={Y.discount} valueKey="orders" fmt={fmtN} color={pal[0]} height={150} tip={(d) => `ส่วนลด ${d.name}: ${fmtN(d.orders)} คำสั่งซื้อ`} />
              </ChartCard>
            </Grid>
          </Grid>
        </Section>

        <Section id="channels" icon="storefront" title="ช่องทางการขาย & พื้นที่">
          <Grid container spacing={2}>
            <Grid item xs={12} md={6}>
              <ChartCard title="สัดส่วนยอดขายตามช่องทาง" table={{ columns: revCols('ช่องทาง'), rows: Y.channel }}>
                <SegBar items={Y.channel} valueKey="revenue" pal={pal} fmtV={fmtB} />
                <Divider sx={{ my: 2 }} />
                <Typography variant="subtitle2" sx={{ mb: 1, color: 'text.secondary' }}>วิธีชำระเงิน (จำนวนคำสั่งซื้อ)</Typography>
                <SegBar items={Y.payment} valueKey="orders" pal={pal} />
                <Typography variant="body2" sx={{ color: 'text.secondary', mt: 1.5 }}>
                  * “เงินสด” มีเฉพาะที่หน้าร้าน ส่วน “เก็บเงินปลายทาง” มีเฉพาะออนไลน์ (หลังตัดข้อมูลขยะแล้ว)
                </Typography>
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={6}>
              <ChartCard title="ยอดขายตามภาค" table={{ columns: revCols('ภาค'), rows: Y.region }}>
                <HBars items={Y.region} valueKey="revenue" fmt={fmtCompactB} color={pal[0]} tip={revTip} labelW={160} />
                <Divider sx={{ my: 2 }} />
                <Typography variant="subtitle2" sx={{ mb: 1, color: 'text.secondary' }}>สถานะคำสั่งซื้อ</Typography>
                <SegBar items={Y.status} valueKey="orders" pal={pal} />
              </ChartCard>
            </Grid>
            <Grid item xs={12}>
              <ChartCard title="10 จังหวัดยอดขายสูงสุด" table={{ columns: revCols('จังหวัด'), rows: Y.province }}>
                <HBars items={Y.province} valueKey="revenue" fmt={fmtCompactB} color={pal[0]} tip={revTip} labelW={140} />
              </ChartCard>
            </Grid>
          </Grid>
        </Section>

        <Section id="customers" icon="groups" title="ลูกค้า">
          <Grid container spacing={2}>
            <Grid item xs={12} md={6}>
              <ChartCard title="จำนวนลูกค้าตามช่วงอายุ" note="กลุ่ม ≤15 รวมลูกค้าที่อายุถูกปัดเป็น 15 ปี"
                table={{ columns: [{ key: 'name', label: 'ช่วงอายุ' }, { key: 'customers', label: 'ลูกค้า (คน)', num: true, fmt: fmtN }], rows: Y.ageCustomers }}>
                <Columns items={Y.ageCustomers} valueKey="customers" fmt={(v) => fmtN(v) + ' คน'} color={pal[0]} height={170} tip={(d) => `อายุ ${d.name}: ${fmtN(d.customers)} คน`} />
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={6}>
              <ChartCard title="ยอดขายตามเพศ" table={{ columns: revCols('เพศ'), rows: Y.gender }}>
                <SegBar items={Y.gender} valueKey="revenue" pal={pal} fmtV={fmtB} />
                <Divider sx={{ my: 2 }} />
                <Typography variant="subtitle2" sx={{ mb: 1, color: 'text.secondary' }}>ยอดขายตามช่วงอายุ</Typography>
                <HBars items={Y.ageRevenue} valueKey="revenue" fmt={fmtCompactB} color={pal[0]} tip={revTip} labelW={70} />
              </ChartCard>
            </Grid>
            <Grid item xs={12}>
              <ChartCard title="ลูกค้า 10 อันดับแรก (ตามยอดซื้อ)">
                <TableContainer>
                  <Table size="small">
                    <TableHead>
                      <TableRow>
                        {['#', 'รหัสลูกค้า', 'ข้อมูล', 'จังหวัด', 'คำสั่งซื้อ', 'ยอดซื้อรวม'].map((h, i) => <TableCell key={h} align={i >= 4 ? 'right' : 'left'} sx={{ fontWeight: 600 }}>{h}</TableCell>)}
                      </TableRow>
                    </TableHead>
                    <TableBody>
                      {Y.topCustomers.map((c, i) => (
                        <TableRow key={c.id} hover>
                          <TableCell className="num">{i + 1}</TableCell>
                          <TableCell>
                            <Stack direction="row" spacing={1} alignItems="center">
                              <span>{c.id}</span>
                              {c.id === Q.topCustomer && <Tooltip title="ซื้อมากกว่าลูกค้าคนอื่นหลายเท่า ควรตรวจสอบว่าเป็นบัญชีร้าน/พนักงานหรือไม่"><Chip size="small" color="warning" variant="outlined" icon={<Icon fontSize="small">priority_high</Icon>} label="ผิดปกติ" /></Tooltip>}
                              {c.profile.includes('15 ปี') && <Tooltip title="อายุอาจถูกปัดเป็น 15 ปี"><Chip size="small" variant="outlined" label="≤15" /></Tooltip>}
                            </Stack>
                          </TableCell>
                          <TableCell>{c.profile}</TableCell>
                          <TableCell>{c.province}</TableCell>
                          <TableCell align="right" className="num">{fmtN(c.orders)}</TableCell>
                          <TableCell align="right" className="num">{fmtB(c.revenue)}</TableCell>
                        </TableRow>
                      ))}
                    </TableBody>
                  </Table>
                </TableContainer>
              </ChartCard>
            </Grid>
          </Grid>
        </Section>

        <Section id="time" icon="schedule" title="ช่วงเวลาที่สั่งซื้อ">
          <Grid container spacing={2}>
            <Grid item xs={12} md={7}>
              <ChartCard title="จำนวนคำสั่งซื้อตามชั่วโมง" note="ทุกสถานะ"
                table={{ columns: [{ key: 'name', label: 'ชั่วโมง', fmt: (v) => v + ':00' }, { key: 'orders', label: 'คำสั่งซื้อ', num: true, fmt: fmtN }], rows: Y.hour }}>
                <Columns items={Y.hour} valueKey="orders" fmt={fmtN} color={pal[0]} height={170} labelEvery={3} tip={(d) => `${d.name}:00–${d.name}:59 น.: ${fmtN(d.orders)} คำสั่งซื้อ`} />
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={5}>
              <ChartCard title="จำนวนคำสั่งซื้อตามวันในสัปดาห์" note="ทุกสถานะ"
                table={{ columns: [{ key: 'name', label: 'วัน' }, { key: 'orders', label: 'คำสั่งซื้อ', num: true, fmt: fmtN }], rows: Y.weekday }}>
                <Columns items={Y.weekday} valueKey="orders" fmt={fmtN} color={pal[0]} height={170} tip={(d) => `วัน${d.name}: ${fmtN(d.orders)} คำสั่งซื้อ`} />
              </ChartCard>
            </Grid>
          </Grid>
        </Section>

        <Section id="service" icon="sentiment_satisfied" title="ความพึงพอใจ & การจัดส่ง">
          <Grid container spacing={2}>
            <Grid item xs={12} md={4}>
              <ChartCard title="การกระจายคะแนนรีวิว" note={`ไม่นับ ${fmtN(K.orders - K.ratedCount)} รายการที่ไม่มีรีวิว`}
                table={{ columns: [{ key: 'name', label: 'คะแนน' }, { key: 'orders', label: 'จำนวน', num: true, fmt: fmtN }], rows: Y.rating }}>
                <HBars items={Y.rating} valueKey="orders" fmt={fmtN} color={pal[0]} labelW={60} />
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={4}>
              <ChartCard title="คะแนนเฉลี่ยตามหมวดสินค้า"
                table={{ columns: [{ key: 'name', label: 'หมวด' }, { key: 'avg', label: 'เฉลี่ย', num: true }, { key: 'n', label: 'รีวิว', num: true, fmt: fmtN }], rows: Y.catRating }}>
                <HBars items={Y.catRating} valueKey="avg" fmt={(v) => v.toFixed(2)} color={pal[0]} labelW={140} tip={(d) => `${d.name}: ${d.avg.toFixed(2)} ดาว จาก ${fmtN(d.n)} รีวิว`} />
              </ChartCard>
            </Grid>
            <Grid item xs={12} md={4}>
              <ChartCard title="วันจัดส่งเฉลี่ยตามภาค" note="เฉพาะออนไลน์ ไม่รวมรายการยกเลิก"
                table={{ columns: [{ key: 'name', label: 'ภาค' }, { key: 'avg', label: 'วันเฉลี่ย', num: true }, { key: 'n', label: 'รายการ', num: true, fmt: fmtN }], rows: Y.delivery }}>
                <HBars items={Y.delivery} valueKey="avg" fmt={(v) => v.toFixed(1) + ' วัน'} color={pal[0]} labelW={140} tip={(d) => `${d.name}: เฉลี่ย ${d.avg} วัน (${fmtN(d.n)} รายการ)`} />
              </ChartCard>
            </Grid>
          </Grid>
        </Section>

        <Divider sx={{ mt: 6, mb: 2 }} />
        <Typography variant="body2" sx={{ color: 'text.secondary', pb: 2 }}>
          ที่มาข้อมูล: ไฟล์ sales_data.csv ({fmtN(Q.rawRows)} แถว × {Q.columns} คอลัมน์) · คัดกรองและสรุปด้วย Python · แสดงผลด้วย React + Material UI
        </Typography>
      </Container>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
